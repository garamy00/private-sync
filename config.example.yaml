# 노트북: agent.yaml 로 복사해서 쓴다
remote:
  host: user@sync-server
  store: ~/private-sync/store

sources:
  - label: 업무 문서
    paths:
      - ~/Documents/work/          # 디렉토리 전체
      - ~/work/견적서_v3.xlsx      # 파일 하나만
    exclude: ["*.tmp"]            # 내장 기본 제외 목록에 추가된다

  - label: 개인 메모
    paths:
      - ~/notes/

# DGX 서버: bot.yaml 로 복사해서 쓴다
# store: ~/private-sync/store
#
# 서버에서 필요한 환경변수:
#   PRIVATE_SYNC_BOT_TOKEN, PRIVATE_SYNC_CHAT_ID, PRIVATE_SYNC_ZIP_PASSWORD
#   PRIVATE_SYNC_API_BASE       (선택) 로컬 Bot API 서버 주소. 미설정 시 공개 API
#   PRIVATE_SYNC_MAX_PART_MB    (선택) 분할 단위 MB. 미설정 시 45
